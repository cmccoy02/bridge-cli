name: Bridge Corpus

on:
  workflow_dispatch:
  schedule:
    # Run weekdays at 06:00 UTC
    - cron: '0 6 * * 1-5'
  pull_request:
    paths:
      - 'corpus/**'
      - '.github/workflows/corpus.yml'
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'corpus/**'
      - '.github/workflows/corpus.yml'
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'

# Never push to external remotes - this workflow is read-only
permissions:
  contents: read

jobs:
  run-corpus:
    name: Run Corpus Fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Bridge CLI dependencies
        run: npm ci

      - name: Setup fixture git repos
        run: node corpus/scripts/setup-fixtures.mjs

      - name: Install fixture dependencies
        run: |
          for fixture in corpus/fixtures/*/; do
            name="$(basename "$fixture")"
            if [ "$name" = ".remotes" ]; then
              continue
            fi
            echo "Installing deps for $fixture"
            if [ -f "$fixture/pnpm-lock.yaml" ]; then
              (cd "$fixture" && pnpm install --frozen-lockfile --ignore-scripts)
            elif [ -f "$fixture/package-lock.json" ]; then
              (cd "$fixture" && npm ci --ignore-scripts)
            fi
          done

      - name: Run corpus fixtures
        id: corpus
        env:
          BRIDGE_HOME: ${{ github.workspace }}/corpus/artifacts/bridge-home
        run: node corpus/scripts/run-all.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: corpus-artifacts
          path: corpus/artifacts/
          retention-days: 14

      - name: Upload scoreboard
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: corpus-scoreboard
          path: corpus/artifacts/scoreboard.json
          retention-days: 30

      - name: Print scoreboard summary
        if: always()
        run: |
          if [ -f corpus/artifacts/scoreboard.json ]; then
            echo "### Corpus Scoreboard" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat corpus/artifacts/scoreboard.json | jq '.summary' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for failures
        if: failure()
        run: |
          echo "::error::Corpus fixtures did not match expected outcomes. Check artifacts for details."
          exit 1
